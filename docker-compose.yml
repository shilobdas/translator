services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: translator_app
      POSTGRES_USER: translator_app
      POSTGRES_PASSWORD: translator_app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translator_app -d translator_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:8000
      DATABASE_URL: postgresql://translator_app:translator_app_password@postgres:5432/translator_app
      CORS_ORIGINS: http://127.0.0.1:8501,http://localhost:8501
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres_data:
